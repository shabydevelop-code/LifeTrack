name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: lifetrack-release
      cancel-in-progress: true
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore permanent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"
            exit 1
          fi
          umask 077
          KEYSTORE="$RUNNER_TEMP/permanent-signing.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass android -alias androiddebugkey > /dev/null
          echo "ANDROID_SIGNING_KEYSTORE=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signing certificate
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EXPECTED=$(keytool -exportcert -keystore "$ANDROID_SIGNING_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)
          REPORT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$REPORT"
          ACTUAL=$(printf '%s\n' "$REPORT" | awk '/Signer #1 certificate SHA-256 digest:/ {print $NF}')
          test "$EXPECTED" = "$ACTUAL" || { echo "::error::APK signing certificate mismatch"; exit 1; }
          echo "Permanent signing certificate verified: $EXPECTED"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifetrack-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk LifeTrack.apk
          TAG="build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" LifeTrack.apk --target "$GITHUB_SHA" --title "Life Track $TAG" --notes "APK signed with permanent testing key" --latest

      - name: Retain five recent releases and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          releases=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -s 'add | map(select(.draft == false and .prerelease == false and (.tag_name | test("^build-[0-9]+-[0-9]+$")) and any(.assets[]?; (.name == "LifeTrack.apk" or .name == "EatTrack.apk")))) | sort_by(.published_at) | reverse')
          latest=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          while IFS= read -r tag; do
            [ "$tag" != "$latest" ] || continue
            gh release delete "$tag" --yes --cleanup-tag
          done < <(jq -r '.[5:][] | .tag_name' <<< "$releases")
          runs=$(gh api --paginate "repos/$GH_REPO/actions/workflows/build-apk.yml/runs?per_page=100" | jq -s '[.[].workflow_runs[]] | sort_by(.run_number) | reverse')
          while IFS= read -r id; do
            [ "$id" != "$CURRENT_RUN" ] || continue
            gh api --method DELETE "repos/$GH_REPO/actions/runs/$id"
          done < <(jq -r '.[5:][] | select(.status == "completed") | .id' <<< "$runs")
