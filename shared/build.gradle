plugins {
    id 'org.jetbrains.kotlin.multiplatform'
    id 'com.android.library'
    id 'org.jetbrains.kotlin.plugin.compose'
}
kotlin {
    androidTarget {
        compilerOptions { jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17) }
    }
    sourceSets {
        commonMain.dependencies {
            api 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
            api 'org.jetbrains.compose.runtime:runtime:1.7.3'
            api 'org.jetbrains.compose.ui:ui:1.7.3'
            api 'org.jetbrains.compose.foundation:foundation:1.7.3'
            implementation 'org.jetbrains.compose.animation:animation-core:1.7.3'
            api 'org.jetbrains.compose.material3:material3:1.7.3'
        }
        commonTest.dependencies { implementation kotlin('test') }
        androidUnitTest.dependencies { implementation 'junit:junit:4.13.2' }
    }
}
android {
    namespace 'com.shabydevelop.lifetrack.shared'
    compileSdk 35
    defaultConfig { minSdk 23 }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
